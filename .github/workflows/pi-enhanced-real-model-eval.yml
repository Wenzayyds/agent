name: Pi Enhanced Real Model Evaluation

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Explicitly authorized provider
        required: true
      model:
        description: Explicitly authorized model
        required: true
      run_id:
        description: Unique experiment run ID
        required: true
      max_total_cost_usd:
        description: Hard external gateway spending cap in USD
        required: true
      max_tokens_per_task:
        required: true
        default: "20000"
      max_calls_per_task:
        required: true
        default: "8"

jobs:
  controlled-real-model:
    environment: pi-enhanced-paid-evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - run: node --experimental-strip-types packages/pi-enhanced/scripts/ci/ci-metadata.ts packages/pi-enhanced/ci-real-model-metadata.json --docker
      - run: docker pull node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
      - run: npm run test:sandbox --workspace=@wz-agent/pi-enhanced
      - name: Record key-free preflight
        run: npm run evaluate:real-agent --workspace=@wz-agent/pi-enhanced -- --preflight --run-id "${{ inputs.run_id }}" --provider "${{ inputs.provider }}" --model "${{ inputs.model }}" --api-key-env PI_EVAL_API_KEY --max-total-cost-usd "${{ inputs.max_total_cost_usd }}" --max-tasks 1 --max-tokens-per-task "${{ inputs.max_tokens_per_task }}" --max-calls-per-task "${{ inputs.max_calls_per_task }}" --timeout-ms 180000 --concurrency 1 --budget-enforcement local_hard_gateway --output-dir evaluation-output --sandbox-image sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 > packages/pi-enhanced/model-preflight.json
      - name: Run real Pi model tasks after environment approval
        env:
          PI_ENHANCED_REAL_MODEL_EVAL: "1"
          PI_EVAL_API_KEY: ${{ secrets.PI_EVAL_API_KEY }}
        run: npm run evaluate:real-agent --workspace=@wz-agent/pi-enhanced -- --execute --run-id "${{ inputs.run_id }}" --provider "${{ inputs.provider }}" --model "${{ inputs.model }}" --api-key-env PI_EVAL_API_KEY --max-total-cost-usd "${{ inputs.max_total_cost_usd }}" --max-tasks 1 --max-tokens-per-task "${{ inputs.max_tokens_per_task }}" --max-calls-per-task "${{ inputs.max_calls_per_task }}" --timeout-ms 180000 --concurrency 1 --budget-enforcement local_hard_gateway --output-dir evaluation-output --sandbox-image sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-enhanced-real-model-${{ github.sha }}-${{ inputs.run_id }}
          path: |
            packages/pi-enhanced/ci-real-model-metadata.json
            packages/pi-enhanced/model-preflight.json
            packages/pi-enhanced/docs/p5-real-model-results.json
            packages/pi-enhanced/evaluation-output
